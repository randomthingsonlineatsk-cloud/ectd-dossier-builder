# Deploys the optional classroom server (Cloudflare Worker + D1) and rebuilds the site so it
# points at it. Run it from the Actions tab ("Run workflow") after adding two repository secrets:
#   CLOUDFLARE_API_TOKEN  - a Cloudflare API token with Workers Scripts:Edit and D1:Edit
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID
# Optional secret for email reminders: BREVO_API_KEY (also set BREVO_SENDER_EMAIL in worker/wrangler.toml).
name: Deploy classroom server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Install Wrangler
        working-directory: worker
        run: npm ci

      - name: Find or create the D1 database
        working-directory: worker
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="ectd-classroom") | (.uuid // .database_id)' | head -n1)
          if [ -z "$ID" ]; then
            npx wrangler d1 create ectd-classroom
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="ectd-classroom") | (.uuid // .database_id)' | head -n1)
          fi
          echo "D1 database: $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml

      - name: Create the tables
        working-directory: worker
        run: npx wrangler d1 execute ectd-classroom --remote --file=schema.sql

      - name: Set the Brevo key (optional)
        working-directory: worker
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ -n "$BREVO_API_KEY" ]; then echo "$BREVO_API_KEY" | npx wrangler secret put BREVO_API_KEY; else echo "No Brevo key: email reminders stay off."; fi

      - name: Deploy the Worker
        id: worker
        working-directory: worker
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          if [ -z "$URL" ]; then echo "::error::Could not read the Worker URL from the deploy output."; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for the new address to answer
        run: |
          URL="${{ steps.worker.outputs.url }}/ectd/v1/health"
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$URL" || true)
            if [ "$CODE" = "200" ]; then cat /tmp/health.json; echo; echo "Server is up."; exit 0; fi
            echo "Attempt $i: HTTP $CODE, waiting for workers.dev to go live..."
            sleep 10
          done
          echo "::warning::The Worker deployed but $URL did not answer 200 within 4 minutes. The site is rebuilt anyway; check the Worker in the Cloudflare dashboard."
          cat /tmp/health.json 2>/dev/null || true"

      - name: Rebuild the site with the classroom server built in
        env:
          VITE_CLASSROOM_API: ${{ steps.worker.outputs.url }}/ectd/v1
        run: |
          npm ci
          npm run build

      - name: Publish the site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cp -r dist /tmp/site
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git rm -rq .
          cp -r /tmp/site/. .
          git add -A
          git commit -m "Deploy site with the classroom server (${{ steps.worker.outputs.url }})" || echo "No changes"
          git push origin gh-pages

      - name: Summary
        run: |
          echo "### Classroom server deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "API address: ${{ steps.worker.outputs.url }}/ectd/v1" >> "$GITHUB_STEP_SUMMARY"
          echo "The site on GitHub Pages now has it built in; the Classroom page is ready to use." >> "$GITHUB_STEP_SUMMARY"
